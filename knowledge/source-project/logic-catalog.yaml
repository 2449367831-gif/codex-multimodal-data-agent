catalog_schema_version: 1.0.0
catalog_id: royal-tiger-source-project-logic
catalog_version: 2026.08.29.3
status: imported_candidate
source_project:
  label: 原皇家小虎数仓取数项目
  source_root_label: D:\\数仓取数规则
  # Keep dates as strings so the catalog can be serialized into the Codex context.
  snapshot_date: "2026-08-25"
  primary_documents:
    - knowledge/source-project/docs/业务取数Agent_取数逻辑总册_20260825.md
    - knowledge/source-project/docs/pickup-table-rules.md
    - knowledge/source-project/docs/线下提货水位项目_服务器Codex接管指引.md
  imported_scope:
    # This is a curated, reviewable snapshot rather than a byte-for-byte copy
    # of every file under the source workspace.
