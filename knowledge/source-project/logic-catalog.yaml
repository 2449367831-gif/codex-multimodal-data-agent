      - ywzt_ods.scm_warehous_detail
      - ywzt_ods.scm_sales_shipment_header
      - ywzt_ods.scm_sales_shipment_detail
      - ywzt_ods.master_sku
      - ywzt_ods.master_wms
    formulas:
      inbound_tons: "SUM(received_quantity * net_weight) / 1000"
      outbound_tons: "SUM(ship_qty * net_weight) / 1000"
    filters:
      finished_goods: "only when this report contract is selected"
      two_c: "terms_of_shipment = '20'"
      transfer_outbound: "DBCK"
      inbound_types: "purchase and transfer separated by warehous_type 10/11"
    reconciliation: [missing_net_weight, conflicting_net_weight, distinct_outbound_code]
  - id: inventory.stale_365d
    display_name: 365天货架期临期库存
    status: candidate_specialized
    aliases: [临期库存, 过期库存, 库存剩余天数]
    source_files:
      - knowledge/source-project/scripts/build_stale_inventory_with_doris.py
    output_grain: warehouse + SKU + production_date
    source_tables: [ywzt_ods.scm_warehous_manage, ywzt_ods.master_sku, ywzt_ods.master_wms]
