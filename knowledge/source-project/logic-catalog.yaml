  - id: supply_chain.cockpit
    display_name: 供应链驾驶舱
    status: candidate_specialized
    aliases: [供应链驾驶舱, 供应链库存风险, 采购在途预测]
    source_files:
      - knowledge/source-project/supply-chain-cockpit/scripts/refresh_dashboard_data.py
    output_grain: region_or_warehouse + product_category
    source_tables:
      - ywzt_ods.scm_warehous_manage
      - ywzt_ods.scm_warehous_occupy
      - ywzt_ods.scm_sales_shipment_header
      - ywzt_ods.scm_sales_shipment_detail
      - ywzt_ods.scm_po_header
      - ywzt_ods.scm_po_detail
      - ywzt_ods.master_sku
      - ywzt_ods.master_wms
    formulas:
      inventory_amount: "available_inventory * latest_valid_standard_purchase_price_within_365_days"
      transit_qty: "GREATEST(arrival_qty, application_qty - received_qty, 0)"
      transit_status: "12 through 16"
      forecast: "six complete months weighted 5/10/15/20/20/30 plus three-month trend capped at +/-20%"
      coverage_days: "available_inventory / (last_30d_outbound / 30)"
    thresholds: ["<14 replenish", "14-30 observe", ">60 pause purchase", "no sales with stock pause purchase"]
  - id: warehouse.tonnage
    display_name: 仓库出入库吨数
    status: candidate_specialized
    aliases: [仓库吨数, 出入库吨数, 入库吨数, 出库吨数]
    source_files:
      - knowledge/source-project/scripts/generate_warehouse_tonnage_image.py
    output_grain: date_range + warehouse
    source_tables:
