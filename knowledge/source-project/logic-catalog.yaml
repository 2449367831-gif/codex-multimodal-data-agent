  excluded_from_import:
    - build/
    - dist/
    - deploy/
    - node_modules/
    - .venv/
    - runtime outputs and credentials
    - unlisted business candidates pending source-contract and metric approval
    - historical *_original.sql variants kept as review-only evidence
governance:
  authority_order:
    - explicit_current_user_instruction
    - approved_current_metric_contract
    - approved_source_project_variant
    - imported_source_project_logic
    - historical_sql_or_handoff_copy
  imported_logic_is_executable: false
  imported_logic_policy: "This catalog is retrieval evidence until a versioned metric/profile, source contracts, SQL template, golden cases, freshness evidence, reconciliation evidence, and business approval exist."
  no_silent_scope_inheritance: true
  unmentioned_owner_sku_warehouse_channel: ALL
  never_global_defaults:
    - HJXH
    - sku_group=50
    - operating_warehouse_filter
    - inventory_status_filter
    - 60_or_75_day_production_window
    - community_order_replacement
  historical_only_patterns:
    - "*_original.sql"
    - deploy/
    - dist/
    - tmp/
  source_boundaries:
    - DMS data is not Doris inventory or shipment data.
    - Excel/static mapping is not a Doris dimension until separately reconciled.
    - 3D snapshots and realtime inventory must be reported as separate sources before merging.
unresolved_business_decisions:
  - id: current_contract.inventory_available_formula_mismatch
    impact: blocking
    current_project_contract: metrics/inventory.available_realtime.yaml
    imported_maintained_logic: knowledge/source-project/sql/realtime_stock.sql
    differences:
      - "inventory status: current contract uses status='0'; maintained SQL uses inventory_status in ('ZP', NULL, '')"
      - "lock/freeze: current contract treats lock and freeze as numeric deductions; maintained SQL safely converts character stock_lock and chooses lock versus freeze"
      - "occupation: current contract deducts lock + freeze; maintained SQL aggregates the selected occupation freeze quantity"
      - "scope: maintained pickup variant additionally requires HJXH, sku_group='50', operating WMS types 10/11 and excludes 残次 warehouses"
    required_action: "Do not silently replace the generic contract. Ask whether the user wants the generic current contract or the candidate HJXH pickup variant, then reconcile and approve a new version."
  - id: pickup.offline_sales_basis
    impact: material
    current_project_text: "Current pickup SQL sums community platform + community distribution + offline other (all Z001). Earlier business text uses offline other + other."
    candidates:
      - "Z001 community platform + Z001 community distribution + Z001 other"
      - "Z001 offline other + type outside Z001/Z004"
    required_action: business_owner_confirmation_and_before_after_reconciliation
  - id: pickup.box_spec_conflict
    impact: material
    affected_skus: [5001080014000035, 5001080015000035]
    observed_values: [100, 240]
    required_action: confirm effective box specification; never choose MAX or MIN silently
  - id: pickup.production_window
    impact: material
    candidates: [60_days, 75_days]
    current_pickup_document: 60_days
    lingshi_dashboard_document: 75_days
    required_action: keep as separate variants until confirmed
  - id: warehouse.operating_mapping
    impact: material
    variants:
      - "pickup: master_wms.wms_type in (10,11) and exclude warehouse name containing 残次"
      - "turnover: explicit business-warehouse node/type exclusions"
      - "lingshi: code/Excel route mapping and FDS exceptions"
      - "online_alert: warehouse-to-region mapping from configuration"
    required_action: select a named report/profile; do not invent a universal mapping
logic_families:
  - id: inventory.realtime_hjxh_operating
    display_name: 提货项目实时可用库存（HJXH 成品经营仓）
    status: candidate_variant
    aliases: [提货实时库存, HJXH可用库存, 成品经营仓库存]
    source_files:
      - knowledge/source-project/sql/realtime_stock.sql
      - knowledge/source-project/docs/pickup-table-rules.md
    output_grain: cargo_owner_id + wms_code + sku_code
    source_tables:
      - ywzt_ods.scm_warehous_manage
      - ywzt_ods.scm_warehous_occupy
      - ywzt_ods.master_sku
      - ywzt_ods.master_wms
    joins:
      - "aggregate inventory and occupation independently by cargo_owner_id + wms_code + sku_code"
      - "master_sku.sku_code = inventory.sku_code"
      - "master_wms.wms_code = inventory.wms_code"
    filters:
      owner: "cargo_owner_id = 'HJXH'"
      inventory_quality: "inventory_status = 'ZP' OR inventory_status IS NULL OR inventory_status = ''"
      warehouse: "master_wms.wms_type IN (10,11) AND master_wms.wms_desc NOT LIKE '%残次%'"
      sku: "master_sku.sku_group = '50'"
      record_status: "use the source-project SQL's effective record condition; verify live delete/status values before promotion"
    time_window:
      inventory: current_state
      occupation: "created_date >= DATE_SUB(NOW(), INTERVAL 60 DAY)"
    unit: EA
    formula: "GREATEST(all_stock_qty - allocate_qty - CASE WHEN stock_lock_qty = 0 THEN freeze_qty ELSE stock_lock_qty END, 0)"
    field_notes:
      - "stock_lock is a character field in the maintained SQL; convert only safe numeric values"
      - "occupation in the maintained realtime SQL aggregates freeze_quantity as allocate_qty"
      - "recent_stock_qty is gross production-date stock and is not available stock"
    freshness_checks:
      - "MAX(scm_warehous_manage.stock_change_time)"
      - "report exact source timestamp, not only a date"
    reconciliation:
      - "reconcile inventory, occupation, and master-dimension key counts before joining"
      - "quantify negative source quantities and available values clipped by GREATEST"
  - id: inventory.recent_production_60d_3d_priority
    display_name: 近60天生产库存（三方3D优先）
    status: candidate_variant
    aliases: [近60天库存, 生产日期库存, 三方仓近日期库存]
    source_files:
      - knowledge/source-project/sql/recent_stock_60d.sql
      - knowledge/source-project/sql/third_party_stock_60d.sql
    output_grain: cargo_owner_id + wms_code + sku_code
    source_tables:
      - ywzt_ods.scm_warehous_manage_3d
      - ywzt_ods.scm_warehous_manage
      - ywzt_ods.master_sku
      - ywzt_ods.master_wms
    joins:
      - "select MAX(DATE(created_date)) as snapshot_date from the 3D source, then use that full day"
      - "3D rows take precedence over realtime rows by warehouse + SKU whenever a row exists, including a zero quantity row"
      - "realtime recent_stock_qty is fallback only when the 3D key is absent"
    filters:
      owner: "cargo_owner_id = 'HJXH'"
      sku: "master_sku.sku_group = '50'"
      production_date: "production_date > current business date - INTERVAL 60 DAY"
    unit: EA
    freshness_checks:
      - "3D snapshot date exists and is reported"
      - "do not silently substitute an older or nearby snapshot"
    reconciliation:
      - "compare 3D-key count, realtime fallback-key count, and overlap count"
  - id: pickup.offline_availability
    display_name: 线下可提货水位
    status: candidate_composite
    aliases: [线下可提货, 提货水位, 可提货箱数, 提货库存天数]
    source_files:
      - knowledge/source-project/sql/realtime_stock.sql
      - knowledge/source-project/sql/third_party_stock_60d.sql
      - knowledge/source-project/sql/offline_sales_7d_warehouse_sku.sql
      - knowledge/source-project/sql/offline_sales_7d.sql
      - knowledge/source-project/sql/sku_box_unit.sql
      - knowledge/source-project/docs/线下提货水位项目_服务器Codex接管指引.md
    output_grain: warehouse + SKU
    source_tables:
      - ywzt_ods.scm_warehous_manage
      - ywzt_ods.scm_warehous_manage_3d
      - ywzt_ods.scm_warehous_occupy
      - ywzt_ods.scm_sales_shipment_header
      - ywzt_ods.scm_sales_shipment_detail
      - ywzt_ods.scm_sales_order_header
      - ywzt_ods.master_store
      - ywzt_ods.master_sku
      - ywzt_ods.master_sku_unit
      - ywzt_ods.master_wms
    joins:
      - "build realtime stock, 3D recent stock, seven-day sales, and box-unit datasets independently"
      - "join final datasets on warehouse + SKU; preserve the union of keys"
      - "sales-order header is existence-only; use EXISTS or distinct order keys"
    filters:
      owner: HJXH
      sku: "master_sku.sku_group = '50'"
      warehouse: "pickup variant uses wms_type 10/11 and excludes 残次"
      shipment: "outbound_code LIKE 'HJXH%'; status IN (700,900,701,901); order type JYCK/HHCK/BFCK/QTCK or SO%"
    time_window:
      sales: "last 7 complete natural days: ship_at >= current_date - 7 days and ship_at < current_date"
      production: 60_days
    unit:
      stored: EA
      displayed: boxes
      box_source: "master_sku_unit where unit = 40 and ea_convert_quantity > 0"
      rounding: floor_for_pickup_display
    formula:
      online_reserved_remaining_ea: "GREATEST(available_inventory_ea - online_sales_7d_ea, 0)"
      offline_pickup_ea: "LEAST(recent_production_inventory_ea, online_reserved_remaining_ea)"
      pickup_boxes: "FLOOR(offline_pickup_ea / box_unit)"
      offline_daily_boxes: "offline_sales_7d_ea / box_unit / 7 (do not floor numerator before averaging)"
      stock_days: "FLOOR(pickup_boxes / offline_daily_boxes); null/-- when denominator <= 0"
    freshness_checks:
      - "stock_change_time"
      - "latest 3D snapshot date"
      - "shipment MAX(ship_at) must cover the seven complete days"
    reconciliation:
      - "3D priority and fallback key counts"
      - "online reservation plus pickup bound"
      - "offline channel components versus total offline sales"
      - "box-unit missing and multi-unit exception list"
    clarification_required:
      - pickup.offline_sales_basis
      - pickup.box_spec_conflict
      - pickup.production_window
  - id: sales.channel_outbound_community_replacement
    display_name: 渠道出库（社区平台订单替换）
    status: candidate_variant
    aliases: [渠道出库, 社区团购出库, 社区订单替换, 平台出库]
    source_files:
      - knowledge/source-project/sql/channel_shipment_with_community_order_replacement.sql
      - knowledge/source-project/sql/channel_shipment_dynamic_with_community_order_replacement.sql
      - knowledge/source-project/sql/channel_shipment_warehouse_dynamic_with_community_order_replacement.sql
    output_grain: date + SKU; optional warehouse
    source_tables:
      - ywzt_ods.scm_sales_shipment_header
      - ywzt_ods.scm_sales_shipment_detail
      - ywzt_ods.scm_sales_order_header
      - ywzt_ods.scm_sales_order_detail
      - ywzt_ods.master_store
      - ywzt_ods.master_sku
      - ywzt_ods.master_sku_unit
      - ywzt_ods.master_wms
    joins:
      - "shipment branch excludes type=Z001 and group1=03 before UNION ALL"
      - "community branch uses sales-order detail request_qty"
      - "community date is DATE_SUB(order_header.created, INTERVAL 1 DAY)"
      - "reaggregate after UNION ALL at the requested grain"
    filters:
      shipment_status: [700, 900, 701, 901]
      community_store: "master_store.type = 'Z001' AND master_store.group1 = '03'"
    units:
      base: EA
      optional: boxes_by_master_sku_unit
    forbidden_substitutions:
      - "do not replace request_qty with ship_qty in the community branch"
      - "do not apply this replacement to generic actual outbound"
    reconciliation:
      - "shipment branch + community branch = final total"
      - "prove excluded community shipment rows do not remain in the shipment branch"
      - "state DY versus DY+WXSPHXD grouping by selected SQL variant"
    clarification_required:
      - "choose date+SKU, date+warehouse+SKU, or dynamic variant"
      - "choose actual shipment or community replacement"
  - id: sales.valid_outbound_project
    display_name: 原项目有效销售出库
    status: candidate_reference
    aliases: [有效销售出库, 实发出库, 销售出库]
    source_files:
      - knowledge/source-project/sql/offline_sales_7d.sql
      - knowledge/source-project/sql/channel_shipment_with_community_order_replacement.sql
    output_grain: date + warehouse + SKU + channel
    source_tables:
      - ywzt_ods.scm_sales_shipment_header
      - ywzt_ods.scm_sales_shipment_detail
      - ywzt_ods.scm_sales_order_header
      - ywzt_ods.scm_sales_order_detail
      - ywzt_ods.master_store
      - ywzt_ods.master_sku
      - ywzt_ods.master_sku_unit
      - ywzt_ods.master_wms
    filters:
      statuses: [700, 900, 701, 901]
      order_types: [JYCK, HHCK, BFCK, QTCK, SO%]
      channels:
        online: "type = Z004"
        offline: "type = Z001"
        community_platform: "type = Z001 and group1 = 03"
        community_distribution: "type = Z001 and price_group = 122"
    measures:
      actual_ea: SUM(ship_qty)
      order_count: COUNT_DISTINCT(outbound_code)
    reconciliation:
      - "channel buckets must be mutually exclusive for the selected report"
      - "request_qty and ship_qty remain separate measures"
  - id: dashboard.lingshi_henmang
    display_name: 零食很忙看板
    status: candidate_specialized
    aliases: [零食很忙, 零食很忙看板, FDS看板]
    source_files:
      - knowledge/source-project/sql/零食很忙看板_当前程序SQL_20260803.sql
    output_grain: routed_dashboard_warehouse + SKU
    source_tables:
      - ywzt_ods.scm_warehous_manage
      - ywzt_ods.scm_in_transit_backup
      - ywzt_ods.scm_sales_shipment_header
      - ywzt_ods.scm_sales_shipment_detail
      - ywzt_ods.scm_sales_order_header
      - ywzt_ods.scm_sales_shipment_allocate_wms
      - ywzt_ods.scm_po_header
      - ywzt_ods.scm_po_detail
      - ywzt_ods.scm_transfer_order_header
      - ywzt_ods.master_sku
      - ywzt_ods.master_sku_unit
      - ywzt_ods.master_store
      - ywzt_ods.master_wms
    special_rules:
      - "Python route maps source warehouses to dashboard warehouses"
      - "specific FDS SKUs can use a different cargo owner/warehouse"
      - "production-date window is 75 days for this dashboard"
      - "SKU names containing 盒 are exempt from the production-date filter"
      - "inventory is gross SUM(in_stock_quantity), without occupation/lock/freeze deductions"
    forbidden_substitutions:
      - "do not use this gross dashboard inventory as generic available inventory"
      - "do not apply the 75-day rule to the pickup 60-day variant"
  - id: sku.active_90d
    display_name: 近90天活跃成品 SKU
    status: candidate_specialized
    aliases: [活跃SKU, 动销SKU, 90天动销]
