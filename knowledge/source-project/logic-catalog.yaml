    source_sql_files_reviewed: 28
    known_unlisted_sql_files: 7
    doris_query_scripts: 16
    # The imported core directory contains the 13 maintained (non-*original.sql)
    # variants. The three historical *_original.sql files remain excluded.
    imported_core_sql_files: 13
    imported_deliverable_sql_files: 8
    source_script_files_reviewed: 35
    known_unlisted_script_files: 19
    source_document_files_reviewed: 29
    known_unlisted_document_files: 26
  imported_script_files:
    - knowledge/source-project/online_inventory_alert/inventory_alert.py
    - knowledge/source-project/scripts/build_stale_inventory_with_doris.py
    - knowledge/source-project/scripts/build_supply_chain_multidim_attachment.py
    - knowledge/source-project/scripts/channel_bag_weekly_report.py
    - knowledge/source-project/scripts/export_supply_chain_sheet_updates.py
    - knowledge/source-project/scripts/generate_active_sku_png.py
    - knowledge/source-project/scripts/generate_lingshi_dashboard.py
    - knowledge/source-project/scripts/generate_planning_weekly_report.py
    - knowledge/source-project/scripts/generate_supply_chain_monthly_report.py
    - knowledge/source-project/scripts/generate_warehouse_tonnage_image.py
    - knowledge/source-project/scripts/prepare_channel_bag_weekly_data.py
    - knowledge/source-project/scripts/query_requested_sku_names_20260723.py
    - knowledge/source-project/scripts/refresh_pickup_data.py
    - knowledge/source-project/supply-chain-cockpit/scripts/inspect_doris_scope.py
    - knowledge/source-project/supply-chain-cockpit/scripts/refresh_dashboard_data.py
