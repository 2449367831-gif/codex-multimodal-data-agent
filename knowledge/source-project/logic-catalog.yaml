      sku: "master_sku.sku_group = '50'"
    measures: [last_ship_at, outbound_90d_ea, box_unit]
    reconciliation: [valid_outbound_status, duplicate_sku_dimension, missing_box_unit]
  - id: report.channel_bag_weekly
    display_name: 渠道袋数周报
    status: candidate_specialized
