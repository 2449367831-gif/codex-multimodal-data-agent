contract_schema_version: 1.0.0
id: ywzt_ods.scm_sales_order_detail
version: 1.0.0
status: declared
source_id: doris_ywzt_ods
role: sales_order_detail
business_key: id
aggregate_key: [company_code, sales_order_code, id]
grain: One physical sales-order detail line after active-detail filtering; request_qty is an order request measure, not a shipped measure.
required_deduplication: true
freshness:
  field: updated
  check: MAX(updated) is source-change time only; it is not a Doris ingestion watermark.
join_to:
  table: ywzt_ods.scm_sales_order_header
  "on": d.company_code = h.company_code AND d.sales_order_code = h.sales_order_code
  cardinality: many_to_one_after_header_uniqueness_check
fields:
  id: {type: varchar, role: physical_key, nullable: false}
  sales_order_id: {type: varchar, role: header_physical_key}
  sales_order_code: {type: varchar, role: business_key, nullable: false}
  source_order_code: {type: varchar, role: detail_source_order, description: Detail source order; historical report labels it order source code. Multiple values per order must be preserved. Metadata verified 2026-09-11.}
  company_code: {type: varchar, role: cargo_owner, nullable: false}
  facility_code: {type: varchar, role: warehouse_key}
  sku_code: {type: varchar, role: sku_key, nullable: false}
  sku_name: {type: varchar, role: detail_display_name}
  request_qty: {type: integer, role: requested_quantity, description: "INT, metadata verified 2026-09-11. Quantity requested on the order; never label as actual outbound. Physical unit and conversion are not inferred from this numeric type."}
  ship_qty: {type: integer, role: shipped_quantity, description: "INT(10,0), metadata verified 2026-09-11. User-selected historical T13/T14 quantity basis; not used by the SO07 request-quantity route and not interchangeable with WMS actual outbound."}
  total_pay_amount: {type: decimal, role: detail_payment, description: "DECIMAL(20,2), metadata verified 2026-09-11. Detail-level payment; independently aggregate owner/order/SKU before proportional return deductions. This is not document actual refund."}
  allocated_qty: {type: integer, role: allocated_quantity, description: "INT, metadata verified 2026-09-11. Order review allocation quantity; not the WMS allocation field and not approval of allocation-to-shipment unit equivalence."}
  quantity_u_m: {type: varchar, role: quantity_unit_reference, description: "Quantity-unit field exists, metadata verified 2026-09-11. Raw unit-code meanings and their relationship to request_qty require confirmation before labeling or conversion."}
  sales_unit_qty: {type: decimal, role: sales_unit_quantity, description: "Sales-unit quantity, metadata verified 2026-09-11. Not an alias for request_qty; no conversion relationship has been approved."}
  sales_unit: {type: varchar, role: sales_unit_reference, description: "Sales-unit field exists, metadata verified 2026-09-11. Do not substitute it for quantity_u_m or assume an EA/box mapping."}
  status: {type: integer, role: logical_status, description: Candidate order-quantity route retains active detail status 0; name provenance separately inspects all non-ETL-deleted detail statuses. Type confirmed by source metadata; this does not approve request_qty units.}
  created: {type: datetime, role: source_create_time}
  updated: {type: datetime, role: source_change_time}
  _fdl_marked_deleted: {type: varchar, role: logical_delete}
metadata_sync:
  mode: compare_only
  observations_path: observations/tables/ywzt_ods.scm_sales_order_detail.yaml
  semantic_changes_require_approval: true
  key_quality: {enabled: true, lookback_days: 30}
