contract_schema_version: 1.0.0
id: inventory.finished_goods_realtime
version: 3.0.0
status: active
business_concept: inventory.finished_goods_quantity
variant: realtime_available_plus_transit
display_name: 当前实时可用成品库存 + 在途
aliases:
- 当前实时成品库存
- 实时成品库存
- 当前成品库存
business_definition: 'Current finished-goods available plus transit using the approved
  stock, occupation, purchase and transfer component SQL. At owner + warehouse code
  + SKU grain: available = GREATEST(in_stock - sales_occupation - transfer_occupation
  - (grouped stock_lock when nonzero, otherwise grouped freeze), 0); in_transit =
  full purchase request quantity + active transfer allocation quantity; total = available
  + in_transit.'
nearby_metrics_not_equivalent:
- inventory.available_realtime
- inventory.snapshot_quantity
- inventory.finished_goods_snapshot
applicability:
  applicable_when:
  - The user explicitly selects current or real-time finished-goods inventory.
  - The requested quantity is the current available quantity plus in-transit quantity.
  not_applicable_when:
  - The user requests a historical snapshot or a different inventory basis.
  - The finished-goods SKU population cannot be resolved from deduplicated SKU master
    data.
  required_signals:
  - current_state
  - finished_goods
  - available_inventory
  - transit
  negative_signals:
  - historical_snapshot
  - unresolved_finished_goods_scope
clarification:
  ambiguity_group: finished_goods_inventory_point
  question: 请选择当前实时成品库存，还是指定区间末日的成品库存快照。
validity:
  effective_from: '2026-10-10T00:00:00+08:00'
  effective_to: null
  supersedes:
  - inventory.finished_goods_realtime@2.0.0
approval:
  business_owner: department_business_owner
  state: approved
  validation_level: static_contract_and_template
  approved_by: current_project_requester
  approved_at: '2026-10-10T00:00:00+08:00'
grain: cargo owner + warehouse + finished-goods SKU, then aggregate to the requested
  output grain
unit: EA
time_window:
  kind: current_state
  freshness_field: stock_change_time
  timezone: Asia/Shanghai
formula: SUM(available_quantity + in_transit_quantity)
sources:
  required:
  - ywzt_ods.master_sku
  - ywzt_ods.scm_warehous_manage
  - ywzt_ods.scm_warehous_occupy
  - ywzt_ods.scm_po_header
  - ywzt_ods.scm_po_detail
  - ywzt_ods.scm_transfer_order_header
  - ywzt_ods.scm_transfer_order_detail
  - ywzt_ods.scm_sales_shipment_allocate_wms
  - ywzt_ods.scm_stock_history
  - ywzt_ods.master_wms
parameters:
  cargo_owner:
    required: false
    default: ALL
    inventory_field: cargo_owner_id
  sku_scope:
    required: false
    default: ALL_WITHIN_FINISHED_GOODS
    inventory_field: sku_code
  warehouse_scope:
    required: false
    default: ALL
    inventory_field: wms_code
  output_grain:
    required: true
    examples:
    - total
    - warehouse
    - sku
    - warehouse_sku
filters:
  inventory_record: inventory_status = 'ZP' OR inventory_status IS NULL OR inventory_status
    = ''; no extra logical-status predicate is implied
  finished_goods: Join one deduplicated master_sku key set and require TRIM(sku_group)
    = '50'.
  scope_defaults: Omitted owner, warehouse, and narrower SKU scopes are ALL within
    the fixed finished-goods population.
  inventory_basis: 'At owner + warehouse code + SKU grain: available = GREATEST(in_stock
    - sales_occupation - transfer_occupation - (grouped stock_lock when nonzero, otherwise
    grouped freeze), 0); in_transit = full purchase request quantity + active transfer
    allocation quantity; total = available + in_transit.'
  inventory_join_rule: Aggregate each component by cargo owner + warehouse CODE +
    SKU, then join.
  missing_inventory: An empty base stock source is unavailable evidence; never publish
    an all-zero stock/turnover report.
required_validations:
- single_statement_and_read_only
- source_freshness
- metric_variant_resolved
- metric_validation_isolation
- inventory_key_aggregation
- inventory_net_nonnegative
execution:
  mode: sql_template
  template: sql_templates/inventory.finished_goods_realtime.v3.sql
template: sql_templates/inventory.finished_goods_realtime.v3.sql
notes: User explicitly replaced the current-inventory basis on 2026-10-10. Reference
  sales columns using allocate_qty, JYCK and 700/900 are outside this inventory adoption;
  actual sales and turnover denominator remain the released ship_qty basis. Preserve
  raw precision; display two decimals. Center images retain the approved nine-center
  template, seven complete days for centers and fourteen for details.
updated_at: '2026-10-10'
depends_on:
- inventory.current_components
dependency_versions:
  inventory.current_components: 1.0.0
