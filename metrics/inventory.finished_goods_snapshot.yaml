contract_schema_version: 1.0.0
id: inventory.finished_goods_snapshot
version: 1.0.0
status: active
business_concept: inventory.finished_goods_quantity
variant: exact_snapshot_gross_quantity
display_name: 区间末成品库存快照
aliases: [区间末成品库存快照, 指定日成品库存, 历史成品库存快照]
business_definition: Finished-goods gross inventory at one exact historical snapshot date, calculated from in_stock_quantity and restricted to the deduplicated finished-goods SKU population where master_sku.sku_group is 50.
nearby_metrics_not_equivalent: [inventory.snapshot_quantity, inventory.available_realtime, inventory.finished_goods_realtime]
applicability:
  applicable_when:
    - The user selects an exact historical finished-goods inventory point.
    - For turnover, the snapshot date is the final complete natural day of the selected sales interval.
  not_applicable_when:
    - The requested snapshot date is missing and cannot be derived from the selected interval.
    - The user requests current real-time, available, transit, nearest-date fallback, or period-average inventory.
  required_signals: [exact_snapshot_date, finished_goods, gross_in_stock]
  negative_signals: [current_state, available_inventory, transit, nearest_date_fallback, average_inventory]
clarification:
  ambiguity_group: finished_goods_inventory_point
  question: 请选择当前实时成品库存，还是指定区间末日的成品库存快照。
validity:
  effective_from: "2026-09-01T00:00:00+08:00"
  effective_to: null
  supersedes: []
approval:
  business_owner: department_business_owner
  state: approved
  validation_level: static_contract_and_template
  approved_by: current_project_requester
  approved_at: "2026-09-01T00:00:00+08:00"
grain: snapshot date + cargo owner + warehouse + finished-goods SKU, then aggregate to the requested output grain
unit: EA
time_window:
  field: backups_date
  interval: exact_snapshot_date
  turnover_derivation: snapshot_date equals end_exclusive minus one complete natural day
  timezone: Asia/Shanghai
formula: SUM(in_stock_quantity)
sources:
  required:
    - ywzt_ods.scm_warehous_manage_backups
    - ywzt_ods.master_sku
parameters:
  snapshot_date: {required: true, type: date}
  cargo_owner: {required: false, default: ALL, snapshot_field: cargo_owner_id}
  sku_scope: {required: false, default: ALL_WITHIN_FINISHED_GOODS, snapshot_field: sku_code}
  warehouse_scope: {required: false, default: ALL, snapshot_field: wms_code}
  output_grain: {required: true, examples: [total, warehouse, sku, warehouse_sku]}
filters:
  finished_goods: "Join one deduplicated master_sku key set and require TRIM(sku_group) = '50'."
  exact_date: The requested date must exist; never fall back to the nearest snapshot.
  scope_defaults: Omitted owner, warehouse, and narrower SKU scopes are ALL within the fixed finished-goods population.
required_validations: [single_statement_and_read_only, business_date_semantics, metric_variant_resolved, metric_validation_isolation, snapshot_date_exists, inventory_net_nonnegative]
execution:
  mode: sql_template
  template: sql_templates/inventory.finished_goods_snapshot.sql
template: sql_templates/inventory.finished_goods_snapshot.sql
notes: This is one period-end stock point, not an average of daily snapshots. Missing exact-date coverage blocks turnover rather than producing zero or using a nearby date.
updated_at: "2026-09-01"
