[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "governed-doris-query-agent"
version = "0.1.0"
description = "Contract-first, read-only business query agent for Apache Doris"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.8,<5.0",
  "PyYAML>=6.0,<7.0",
  "PyMySQL>=1.1,<2.0",
  "jsonschema>=4.23,<5.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlglot>=26,<30",
  "langgraph>=1.0,<2.0",
  "mcp>=2.1,<3.0",
  "openai-codex>=0.147,<0.148",
  "httpx>=0.28,<1.0",
  "tzdata>=2025.2",
  "Pillow>=10,<13",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.2,<5.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
]

[project.scripts]
doris-query-agent = "app.__main__:main"
doris-metadata-sync = "tools.metadata_sync:main"
doris-source-project-sync = "tools.sync_source_project:main"
doris-query-mcp = "app.mcp_server:main"
doris-codex-agent = "app.codex_agent:main"
doris-query-backend = "app.query_backend:main"
doris-query-chat = "app.chat_api:main"
doris-learning-digest = "tools.rebuild_learning_digest:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "tools"]
exclude = [
  "app/runtime_data/**",
  "app/tests/**",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel.force-include]
"metrics" = "metrics"
"sources" = "sources"
"profiles" = "profiles"
"rules" = "rules"
"sql_templates" = "sql_templates"
"schemas" = "schemas"
"releases" = "releases"
"knowledge" = "knowledge"
"frontend" = "frontend"
"skills/doris-query-workflow" = "skills/doris-query-workflow"

[tool.hatch.build.targets.sdist]
exclude = [
  ".env",
  ".venv/**",
  "app/runtime_data/**",
  "var/**",
  "candidates/*.json",
  "candidates/*.md",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests"]
addopts = "-q"
